<svg xmlns="http://www.w3.org/2000/svg" width="470" height="38" viewBox="0 0 470 38" role="img" aria-label="Status: training local LLMs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="468" height="36" rx="18" fill="#0d1117" stroke="#0e75b6" stroke-width="1.5"/>
  <circle cx="24" cy="19" r="5" fill="#2ea043">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="19" r="5" fill="none" stroke="#2ea043" stroke-width="1.5">
    <animate attributeName="r" values="5;13" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="24" font-family="'Fira Code', Consolas, Menlo, monospace" font-size="13" fill="#58a6ff">status: training local LLMs, Docker still alive</text>
</svg>
