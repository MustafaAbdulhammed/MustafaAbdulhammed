<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e75b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0e75b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e75b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="url(#base)"/>
  <rect x="-250" y="3" width="250" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" from="-250" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
